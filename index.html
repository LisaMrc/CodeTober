<head>
  <meta charset="UTF-8" />
  <title>CodeTober</title>

  <!-- Tailwind & CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#ff7518",
            panel: "#1b1030",
            block: "#2a1747",
            line: "#3d2463",
            muted: "#a190c2",
            accent: "#a259ff",
            lime: "#b6ff5c",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />

  <!-- Libs -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>

  <!-- Animated effects -->
  <script src="gooey.js" defer></script>

  <!-- JS -->
  <script src="script.js" defer></script>
</head>
<body>
  <div id="page" class="grid grid-cols-2 gap-2 p-4">
    <form id="form" class="flex flex-col bg-panel border border-line rounded-2xl p-4">
      <h1 class="font-serif text-2xl text-brand text-center font-bold">Build your challenge</h1>

      <div class="my-4 flex flex-row">
        <input
          id="username-input"
          type="text"
          placeholder="your-username"
          class="bg-[#0d0718] border border-line rounded-lg px-3 py-2 text-sm w-full"
        />
        <p class="w-full">'s 2026 CodeTober challenge</p>
      </div>

      <div id="weeks-form"></div>
    </form>

    <div class="flex flex-col gap-4">
      <div id="card" class="flex flex-col gap-2 bg-panel border-2 border-dashed border-brand/70 rounded-2xl p-4">
        <h2 id="card-username" class="font-mono text-l text-center text-muted sub">Your username's</h2>
        <h1 class="font-serif text-2xl text-brand text-center font-bold">🎃 CodeTober 2026</h1>
        <h2 class="font-mono text-l text-center text-muted sub my-2 uppercase">4 weeks - 4 prompts</h2>
        <div id="weeks-card"></div>
      </div>

      <div class="flex flex-row gap-2 w-full justify-center">
        <button id="download-png" type="button" class="bg-brand text-white font-bold rounded-full p-3">
          Download as PNG (static)
        </button>
        <button id="download-svg" type="button" class="bg-brand text-white font-bold rounded-full p-3">
          Download as SVG (animated)
        </button>
      </div>
    </div>
  </div>
</body>
