<head>
  <meta charset="UTF-8" />
  <title>CodeTober</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <form class="border-2 border-solid m-8 p-8">
    <div id="week-1" class="flex flex-col gap-8">
      <input type="text" id="project-name-input-1" class="border-2 border-solid" placeholder="Name of your project" />

      <select id="project-language-select-1">
        <option value="Language">Select your main target language</option>
        <option value="JavaScript">JavaScript</option>
        <option value="React">React</option>
        <option value="TypeScript">TypeScript</option>
        <option value="Tailwind">Tailwind</option>
      </select>
    </div>
  </form>

    <form class="border-2 border-solid m-8 p-8">
    <div id="week-2" class="flex flex-col gap-8">
      <input type="text" id="project-name-input-2" class="border-2 border-solid" placeholder="Name of your project" />

      <select id="project-language-select-2">
        <option value="Language">Select your main target language</option>
        <option value="JavaScript">JavaScript</option>
        <option value="React">React</option>
        <option value="TypeScript">TypeScript</option>
        <option value="Tailwind">Tailwind</option>
      </select>
    </div>
  </form>

  <div id="card" class="border-2 border-solid m-8 p-8">
    <h1 class="text-orange-500 font-bold">CodeTober 2026</h1>
    <p id="week-line-1"></p>
    <p id="week-line-2"></p>
  </div>
</body>
