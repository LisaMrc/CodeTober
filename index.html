<head>
  <meta charset="UTF-8" />
  <title>CodeTober</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="page" class="grid grid-cols-2 gap-4">
    <form id="form" class="border-2 border-solid m-6 p-6 flex flex-col gap-2">
      <h1>Your challenge</h1>

      <div id="pseudo" class="my-8 flex flex-row">
        <input type="text" placeholder="your-pseudo" class="border-2 border-solid" />
        <p>'s 2026 CodeTober challenge</p>
      </div>

      <div id="weeks-form"></div>
    </form>

    <div id="card" class="border-2 border-solid m-6 p-6">
      <h1 class="text-orange-500 font-bold">CodeTober 2026</h1>
      <p id="week-line-1"></p>
      <p id="week-line-2"></p>
      <p id="week-line-3"></p>
      <p id="week-line-4"></p>
    </div>
  </div>
</body>
